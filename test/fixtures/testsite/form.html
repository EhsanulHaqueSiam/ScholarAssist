<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Example Scholarship Application</title></head>
<body>
  <h1>Example Scholarship Application</h1>
  <form id="app" onsubmit="event.preventDefault(); document.body.innerHTML='<h1>Application received</h1>'">
    <label>First name <input id="fn" autocomplete="given-name"></label>
    <label>Email <input id="em" type="email" autocomplete="email"></label>
    <!-- deliberately unlabeled: exercises the rung-1 CSS fallback -->
    <div>Grade point average <input id="gpa_x9"></div>
    <label>Why do you deserve this? <textarea id="why" maxlength="2000"></textarea></label>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
