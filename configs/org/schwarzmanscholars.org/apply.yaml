# Schwarzman Scholars (Tsinghua, fully funded, open to all nationalities).
# Portal is a Technolutions Slate instance — identical register structure to
# McCall MacBain (Slate standard ids). Application form is behind the account;
# record the apply flow with `scholar config record` after activating.
# Structure captured 2026-08-12.
schema_version: 1
site:
  id: schwarzman
  name: Schwarzman Scholars
  match:
    - "https://connect.schwarzmanscholars.org/**"
    - "https://www.schwarzmanscholars.org/**"
  maintainer: "@EhsanulHaqueSiam"
  last_verified: 2026-08-12

requires: [login]

fields:
  applicant.email:
    locator: { primary: { css: "#email" } }
    autocomplete: email
  applicant.given_name:
    locator: { primary: { css: "#first" } }
    autocomplete: given-name
  applicant.family_name:
    locator: { primary: { css: "#last" } }
    autocomplete: family-name
  applicant.dob_month:
    locator: { primary: { css: "#birthdate_m" } }
    kind: select
  applicant.dob_day:
    locator: { primary: { css: "#birthdate_d" } }
    kind: select
  applicant.dob_year:
    locator: { primary: { css: "#birthdate_y" } }
    kind: select

flows:
  register:
    pages:
      - id: register
        steps:
          - action: navigate
            url: "https://connect.schwarzmanscholars.org/account/register"
          - action: fill_fields
            fields:
              - applicant.email
              - applicant.given_name
              - applicant.family_name
              - applicant.dob_month
              - applicant.dob_day
              - applicant.dob_year
        advance:
          target:
            primary: { css: "button[type=submit]" }
          submit: true

  apply:
    pages:
      - id: entry
        steps:
          - action: navigate
            url: "https://connect.schwarzmanscholars.org/apply/"
          - action: wait
            for: { locator: { text: "Application Home Page" } }
