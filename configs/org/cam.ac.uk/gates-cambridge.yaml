# Gates Cambridge — there is NO separate scholarship form: you apply via the
# Cambridge postgraduate application (Applicant Portal) and tick the Gates
# Cambridge funding option. Deadline is your course deadline: 8 Dec 2026 or
# 6 Jan 2027, 00:00 GMT (course-dependent) for the international round.
# The portal is account-gated; record post-login pages per course.
# Structure noted 2026-08-12.
schema_version: 1
site:
  id: gates-cambridge
  name: Gates Cambridge (via Cambridge Applicant Portal)
  match:
    - "https://apply.postgraduate.study.cam.ac.uk/**"
    - "https://www.postgraduate.study.cam.ac.uk/**"
  maintainer: "@EhsanulHaqueSiam"
  last_verified: 2026-08-12

requires: [login]

flows:
  apply:
    pages:
      - id: entry
        steps:
          - action: navigate
            url: "https://apply.postgraduate.study.cam.ac.uk/"
